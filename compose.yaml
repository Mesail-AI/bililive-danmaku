# 启动：make compose build && make compose up
# 配置：复制 config.example.yaml 为 config.yaml（填入真实凭证），按需创建 .env。
#
# 注意：config.yaml 与 .env 两个卷挂载默认关闭——若宿主文件不存在，Docker 会把
# 挂载点静默创建成空目录挂进容器（配置读取将以目录错误失败）。首次部署时在
# 宿主准备好这两个文件后再解开注释，或改用 compose.override.yaml 管理。
# 容器内服务监听 config 的 server_port（默认 8181），server_host 必须设为
# 0.0.0.0 才能从宿主机访问。
services:
  app:
    build: .
    image: bililive-danmaku:latest
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8181}:8181"
    # volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
